<!DOCTYPE html>

<html>

<head> <title>Variables 2</title> </head>

<body>

<h1>JavaScript Variable Scope</h1>

<script type="text/javascript">

    // Declaramos una variable global.
    var myVar = "global";

    // Creamos una función.
    function checkscope() {

        // Declaramos una variable local con el mismo nombre.
        var myVar = "Local";

        // Mostramos el valor de la variable local.
        document.write(myVar);
    }

    // Ejecutamos la función.
    checkscope();

</script>


</body>

</html>
