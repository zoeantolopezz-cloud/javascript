<!DOCTYPE html>

<html>

<head> <title>Variables 1</title> </head>

<body>

<h1>JavaScript Variables</h1>

<script type="text/javascript">

    // Declaramos dos variables.
    var money, name;

    // Asignamos un valor a la variable name.
    var name = "Ali";

    // Asignamos un valor a la variable money.
    money = 2000.50;

    // Mostramos los valores en la página.
    document.write("Name: " + name + "<br>");
    document.write("Money: " + money);

</script>


</body>

</html>
