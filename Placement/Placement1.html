<!DOCTYPE html>
<html>
<head>
	<title>Placement 1</title>
	<script type="text/javascript">
		// Función que muestra un mensaje cuando se presiona el botón.
		function sayHello() {
			alert("Hello World");
		}
	</script>
</head>
<body>
	<h1>JavaScript in Head Section</h1>
	<p>Click here for the result:</p>
	<input type="button" onclick="sayHello()" value="Say Hello" />
</body>
</html>
